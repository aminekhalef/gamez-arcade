<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HARBA! – Run from the Boulis</title>
<style>
:root{--bg:#f4efe6;--fg:#12315a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a2b;--fg:#f1ead9}}
:root[data-theme="dark"]{--bg:#0e1a2b;--fg:#f1ead9}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:8px;box-sizing:border-box}
canvas{width:100%;max-width:900px;aspect-ratio:2/1;border-radius:12px;touch-action:none;background:#9fd3f0}
p{margin:0;font-size:14px;text-align:center;opacity:.8}
</style></head><body>
<canvas id="g"></canvas>
<p>Space / ↑ = jump (again in the air = double jump) · ↓ = slide · on touch: tap the top to jump, the bottom to slide</p>
<script>
const c=document.getElementById('g'),x=c.getContext('2d'),W=800,H=400,G=330,FINISH=1000;
c.width=W;c.height=H;
const LEVELS=[
  {name:'Bab Bhar',start:0,end:200,pressure:.10,booster:'brik',boostName:'Brik Shield'},
  {name:'Sidi Bou Said',start:200,end:400,pressure:.14,booster:'bambalouni',boostName:'Bambalouni Bounce'},
  {name:'Souk El Attarine',start:400,end:600,pressure:.18,booster:'harissa',boostName:'Harissa Turbo'},
  {name:'La Marsa Corniche',start:600,end:800,pressure:.22,booster:'jasmin',boostName:'Jasmin Breeze'},
  {name:'Zitouna Quarter',start:800,end:FINISH,pressure:.26,booster:'chechia',boostName:'Chechia Magnet'}
];
let st='menu',best=0,p,ob,co,pu,fx,gap,sp,dist=0,coins,t=0,inv,nx,shake=0,overT=0,shield=0,turbo=0,bounce=0,breeze=0,magnet=0,level=0,onlineMode=false,lastReport=-1;
try{best=+localStorage.getItem('harba')||0}catch(e){}
function levelPickup(lv,x0=W+260){return{k:LEVELS[lv].booster,x:x0,y:G-110}}
function reset(){p={y:G,vy:0,sl:false,j:0};ob=[];co=[];fx=[];gap=170;sp=6;dist=0;coins=0;inv=0;nx=600;shake=0;shield=0;turbo=0;bounce=0;breeze=0;magnet=0;level=0;pu=[levelPickup(0,650)];lastReport=-1}
reset();
function reportProgress(finished=false){
  if(!onlineMode)return;
  const score=Math.min(FINISH,Math.floor(dist/50));
  if(score===lastReport&&!finished)return;
  lastReport=score;
  parent.postMessage({type:'gamez-progress',game:'harba',score,finished},location.origin);
}
function jump(){
  if(st==='level'){
    level++;ob=[];co=[];fx=[];gap=Math.min(230,Math.max(gap,170));nx=dist+650;inv=45;shield=0;turbo=0;bounce=0;breeze=0;magnet=0;pu=[levelPickup(level,W+230)];st='play';
    float('LEVEL '+(level+1)+' · '+LEVELS[level].name);burst(400,120,'#f4c542',18);snd(760,.18);reportProgress();return
  }
  if(st!=='play'){if(st==='over'&&t-overT<40)return;reset();st='play';reportProgress();return}
  if(p.y>=G){p.vy=bounce>0?-15:-13.5;p.j=1;snd(440)}else if(p.j<(bounce>0?3:2)){p.vy=bounce>0?-13:-12;p.j++;snd(620+p.j*80);burst(170,p.y,'#fff',6)}
}
addEventListener('keydown',e=>{const k=e.code;
  if(['Space','ArrowUp','KeyW'].includes(k)){e.preventDefault();if(!e.repeat)jump()}
  if(k==='ArrowDown'||k==='KeyS'){e.preventDefault();p.sl=true}});
addEventListener('keyup',e=>{if(e.code==='ArrowDown'||e.code==='KeyS')p.sl=false});
c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect();
  if(st==='play'&&e.clientY-r.top>r.height*.55)p.sl=true;else jump()});
addEventListener('pointerup',()=>{p.sl=false});
addEventListener('message',e=>{
  if(e.origin!==location.origin||!e.data||e.data.type!=='gamez-online-start'||e.data.game!=='harba')return;
  onlineMode=true;reset();st='play';reportProgress();
});

let ac;
function snd(f,d=.1){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
function burst(bx,by,col,n){for(let i=0;i<n;i++)fx.push({x:bx,y:by,vx:(Math.random()-.5)*5,vy:(Math.random()-.8)*4,l:25,c:col})}
function float(s){fx.push({x:170,y:p.y-90,vx:0,vy:-.8,l:70,s:s})}
function activateBooster(k){
  shield=0;turbo=0;bounce=0;breeze=0;magnet=0;
  if(k==='brik')shield=1;
  else if(k==='bambalouni')bounce=420;
  else if(k==='harissa')turbo=260;
  else if(k==='jasmin')breeze=420;
  else if(k==='chechia')magnet=520;
  float(LEVELS[level].boostName+'!');snd(700,.15)
}
function spawn(){
  const r=Math.random();let o;
  if(r<.3)o={k:'crate',w:42,h:42,y:G-42};
  else if(r<.55)o={k:'vespa',w:64,h:40,y:G-40};
  else if(r<.75)o={k:'cat',w:28,h:20,y:G-20};
  else o={k:'wash',w:90,h:48,y:238};
  o.x=W+50;ob.push(o);
  if(Math.random()<.7){
    const cy=o.k==='wash'?G-20:G-95-Math.random()*35;
    for(let i=0;i<4;i++)co.push({x:W+30+i*34,y:cy});
  }
  if(Math.random()<.18)pu.push(levelPickup(level,W+320));
  nx=dist+360+Math.random()*240+sp*14;
}
function update(){
  sp=Math.min(5.5+dist/3200,10)*(turbo>0?1.5:1);dist+=sp;const m=dist/50;
  gap=Math.min(230,gap+.16-LEVELS[level].pressure);
  p.vy+=.7+(p.sl&&p.y<G?1.2:0);p.y+=p.vy;if(p.y>=G){p.y=G;p.vy=0;p.j=0}
  if(dist>nx)spawn();
  if(inv>0)inv--;if(shake>0)shake--;
  if(turbo>0){turbo--;inv=Math.max(inv,2);gap=Math.min(230,gap+.7);if(t%4===0)burst(150,p.y-20,'#e0203a',2)}
  if(bounce>0)bounce--;
  if(breeze>0){breeze--;gap=Math.min(230,gap+.34);if(t%7===0)burst(145,p.y-35,'#f8f4dc',2)}
  if(magnet>0)magnet--;
  const s=p.sl&&p.y>=G,h=s?30:62,w=s?46:28,pb={x:166,y:p.y-h+8,w:w-12,h:h-12};
  for(const o of ob){o.x-=sp;
    if(inv<=0&&pb.x<o.x+o.w&&pb.x+pb.w>o.x&&pb.y<o.y+o.h&&pb.y+pb.h>o.y){if(shield){shield=0;inv=60;snd(300);burst(174,p.y-30,'#f4c542',12);float('Shield used!')}else{gap-=35;inv=90;shake=12;snd(120,.2)}}}
  ob=ob.filter(o=>o.x>-120);
  for(const q of co){q.x-=sp;if(magnet>0&&Math.abs(q.x-174)<190){q.x+=(174-q.x)*.075;q.y+=(p.y-h/2-q.y)*.075}
    if(Math.hypot(q.x-(160+w/2),q.y-(p.y-h/2))<38){q.d=1;coins++;gap=Math.min(230,gap+8);snd(880+coins%8*60,.05);burst(q.x,q.y,'#f4c542',4);if(coins%10===0){float(coins+' dinar!');gap=Math.min(230,gap+30)}}}
  co=co.filter(q=>!q.d&&q.x>-30);
  for(const u of pu){u.x-=sp;if(Math.hypot(u.x-(160+w/2),u.y-(p.y-h/2))<36){u.d=1;activateBooster(u.k)}}
  pu=pu.filter(u=>!u.d&&u.x>-40);
  for(const f of fx){f.x+=f.vx;f.y+=f.vy;f.l--}fx=fx.filter(f=>f.l>0);
  if(onlineMode&&Math.floor(m)!==lastReport)reportProgress();
  if(level<LEVELS.length-1&&m>=LEVELS[level].end){
    dist=LEVELS[level].end*50;st='level';overT=t;ob=[];co=[];pu=[];reportProgress();snd(920,.2);return
  }
  if(m>=FINISH){st='win';overT=t;gap=Math.max(gap,12);const sc=FINISH;
    if(sc>best){best=sc;try{localStorage.setItem('harba',best)}catch(e){}}reportProgress(true);return}
  if(gap<=10){st='over';overT=t;const sc=Math.floor(m);
    if(sc>best){best=sc;try{localStorage.setItem('harba',best)}catch(e){}}reportProgress(true)}
}
function step(){t++;if(st==='play')update();else if(st==='menu')dist+=2}

const L=(sc,w,fn)=>{const off=dist*sc,b=Math.floor(off/w);
  for(let k=-1;k<Math.ceil(W/w)+1;k++){const i=b+k;fn(i,i*w-off)}};
const mod=(a,n)=>((a%n)+n)%n;
function palm(x0){
  x.strokeStyle='#7a5530';x.lineWidth=8;x.beginPath();x.moveTo(x0,G);x.quadraticCurveTo(x0+15,G-80,x0+5,G-150);x.stroke();
  x.strokeStyle='#2f8f4e';x.lineWidth=5;
  for(let a=0;a<7;a++){const ang=Math.PI*(1.05+a*.15),ex=x0+5+Math.cos(ang)*55,ey=G-150+Math.sin(ang)*20+22;
    x.beginPath();x.moveTo(x0+5,G-150);x.quadraticCurveTo(x0+5+Math.cos(ang)*30,G-185,ex,ey);x.stroke()}
}
function chechia(hx,hy){x.fillStyle='#c8102e';x.fillRect(hx-7,hy-14,14,10);x.fillStyle='#111';x.fillRect(hx+5,hy-12,2,9)}
function cap(hx,hy){x.fillStyle='#12203d';x.fillRect(hx-8,hy-13,16,7);x.fillStyle='#000';x.fillRect(hx-9,hy-7,18,3);x.fillStyle='#f4c542';x.fillRect(hx-2,hy-11,4,3)}
function person(px,py,sl,shirt,pants,hat){
  const s=py<G?9:Math.sin(t*.4)*10;
  x.lineCap='round';x.lineWidth=7;x.strokeStyle=pants;x.beginPath();
  if(!sl){
    x.moveTo(px+10,py-24);x.lineTo(px+10+s,py-2);x.moveTo(px+18,py-24);x.lineTo(px+18-s,py-2);x.stroke();
    x.fillStyle=shirt;x.fillRect(px+3,py-48,22,26);
    x.fillStyle='#e0a878';x.beginPath();x.arc(px+14,py-56,8,0,7);x.fill();hat(px+14,py-56);
  }else{
    x.moveTo(px+8,py-12);x.lineTo(px-14,py-3);x.stroke();
    x.fillStyle=shirt;x.fillRect(px+2,py-22,28,16);
    x.fillStyle='#e0a878';x.beginPath();x.arc(px+38,py-16,8,0,7);x.fill();hat(px+38,py-16);
  }
}
const mix=(a,b,k)=>a+(b-a)*k;
let lastD=0;
const clouds=[0,1,2,3,4,5].map(i=>({x:i*170,y:30+mod(i*47,80),s:.6+mod(i*31,10)/10}));
function rr(a,b,w,h,r){x.beginPath();x.roundRect?x.roundRect(a,b,w,h,r):x.rect(a,b,w,h)}
function palm2(x0){
  const sw=Math.sin(t*.03+x0)*3,cx=x0+6+sw,cy=G-155;
  x.lineCap='round';x.strokeStyle='#6b4a2b';x.lineWidth=10;x.beginPath();x.moveTo(x0,G);x.quadraticCurveTo(x0+18,G-80,cx,cy);x.stroke();
  x.strokeStyle='rgba(0,0,0,.22)';x.lineWidth=2;for(let a=1;a<9;a++){const yy=G-a*17;x.beginPath();x.moveTo(x0+a*1.3-3,yy);x.lineTo(x0+a*1.3+7,yy-3);x.stroke()}
  for(let a=0;a<9;a++){const ang=Math.PI*(1+a*.125)+Math.sin(t*.04+a)*.04,ex=cx+Math.cos(ang)*62,ey=cy+Math.sin(ang)*26+26;
    x.strokeStyle=a%2?'#2d8a4e':'#3fae63';x.lineWidth=5;x.beginPath();x.moveTo(cx,cy);x.quadraticCurveTo(cx+Math.cos(ang)*34,cy-26,ex,ey);x.stroke();
    x.strokeStyle='#1d6a38';x.lineWidth=1.5;x.stroke()}
  x.fillStyle='#8b5a2b';x.beginPath();x.arc(cx-3,cy+5,4,0,7);x.arc(cx+4,cy+7,4,0,7);x.fill();
}
function hero(cx,cy,o){
  const air=cy<G-2&&!o.sl,ph=o.sl?.8:t*.35+(o.off||0);
  const leg=(off,back)=>{const a=air?(off?-.9:.7):Math.sin(ph+off)*.95,bend=air?(off?1:.3):Math.max(0,Math.cos(ph+off))*.9,hx=cx,hy=cy-26,kx=hx+Math.sin(a)*13,ky=hy+Math.cos(a)*13,ax=kx+Math.sin(a-bend)*13,ay=ky+Math.cos(a-bend)*13;
    x.strokeStyle=back?o.pants2:o.pants;x.lineWidth=7;x.lineCap='round';x.lineJoin='round';x.beginPath();x.moveTo(hx,hy);x.lineTo(kx,ky);x.lineTo(ax,ay);x.stroke();
    x.fillStyle=o.shoe;x.beginPath();x.ellipse(ax+3,ay+1,6,3.5,0,0,7);x.fill()};
  const arm=(off,back)=>{const a=-Math.sin(ph+off)*.9,sx=cx,sy=cy-44,ex=sx+Math.sin(a)*10,ey=sy+Math.cos(a)*10,hx=ex+Math.sin(a-1)*9,hy=ey+Math.cos(a-1)*9;
    x.strokeStyle=back?o.shirt2:o.shirt;x.lineWidth=5;x.beginPath();x.moveTo(sx,sy);x.lineTo(ex,ey);x.lineTo(hx,hy);x.stroke();x.fillStyle=o.skin;x.beginPath();x.arc(hx,hy,3,0,7);x.fill()};
  leg(Math.PI,1);arm(0,1);
  const tg=x.createLinearGradient(cx-11,0,cx+11,0);tg.addColorStop(0,o.shirt);tg.addColorStop(1,o.shirt2);x.fillStyle=tg;rr(cx-11,cy-50,22,28,6);x.fill();
  o.deco(cx,cy);leg(0,0);arm(Math.PI,0);
  x.fillStyle=o.skin;x.beginPath();x.arc(cx+1,cy-58,9,0,7);x.fill();
  x.fillStyle='#fff';x.fillRect(cx+4,cy-61,4,3);x.fillStyle='#111';x.fillRect(cx+6,cy-61,2,3);
  o.head(cx+1,cy-58);
}
const P={shirt:'#fbfbf7',shirt2:'#d7d6cc',pants:'#1f5fa8',pants2:'#16457f',shoe:'#e0b030',skin:'#e0a878',
  deco:(cx,cy)=>{x.fillStyle='#c8102e';x.fillRect(cx-9,cy-51,18,5);x.fillStyle='#1f5fa8';x.fillRect(cx-11,cy-38,22,3)},
  head:(hx,hy)=>{x.fillStyle='#c8102e';rr(hx-8,hy-16,16,11,3);x.fill();x.fillStyle='#8f0b20';x.fillRect(hx-8,hy-8,16,3);
    x.strokeStyle='#111';x.lineWidth=1.5;x.beginPath();x.moveTo(hx+7,hy-12);x.quadraticCurveTo(hx+14,hy-8+Math.sin(t*.4)*3,hx+11,hy-1);x.stroke();
    x.strokeStyle='#2a1a10';x.lineWidth=2;x.beginPath();x.moveTo(hx+3,hy+3);x.lineTo(hx+9,hy+3);x.stroke()}};
const C={shirt:'#2c4a9a',shirt2:'#1b2f5c',pants:'#12203d',pants2:'#0b1630',shoe:'#000',skin:'#c98d5e',off:1.3,
  deco:(cx,cy)=>{x.fillStyle='#111';x.fillRect(cx-11,cy-27,22,3);x.fillStyle='#f4c542';x.beginPath();x.arc(cx+5,cy-42,2.5,0,7);x.fill()},
  head:(hx,hy)=>{x.fillStyle='#12203d';rr(hx-9,hy-15,18,8,3);x.fill();x.fillStyle='#000';x.fillRect(hx-3,hy-8,14,3);x.fillStyle='#f4c542';x.fillRect(hx-1,hy-13,4,3);
    x.fillStyle='#111';x.fillRect(hx+1,hy-3,9,3.5);x.fillStyle='#1a1a1a';x.fillRect(hx+2,hy+3,7,2)}};
function draw(){
  const k=(1+Math.cos(dist/5000))/2,lit=k<.55,sunX=620,sunY=mix(185,100,k);
  x.save();
  if(shake>0)x.translate((Math.random()-.5)*8,(Math.random()-.5)*8);
  let g=x.createLinearGradient(0,0,0,230);
  g.addColorStop(0,'hsl('+(215+(1-k)*55)+',65%,'+(28+k*32)+'%)');
  g.addColorStop(1,'hsl('+(38-(1-k)*18)+',90%,'+(62+k*22)+'%)');
  x.fillStyle=g;x.fillRect(-10,-10,W+20,H+20);
  if(k<.5){x.fillStyle='rgba(255,255,255,'+(.5-k)*1.6+')';for(let a=0;a<30;a++)x.fillRect(mod(a*97,W),mod(a*53,150),1.5,1.5)}
  const sg=x.createRadialGradient(sunX,sunY,5,sunX,sunY,150);sg.addColorStop(0,'rgba(255,240,190,.95)');sg.addColorStop(.25,'rgba(255,200,110,.5)');sg.addColorStop(1,'rgba(255,170,90,0)');
  x.fillStyle=sg;x.fillRect(sunX-160,sunY-160,320,320);x.fillStyle='#fff3c4';x.beginPath();x.arc(sunX,sunY,30,0,7);x.fill();
  for(const c of clouds){const cx=mod(c.x-dist*.04,W+240)-120;x.fillStyle='rgba(255,255,255,'+(.22+.35*k)+')';
    for(const d of[[0,0,22],[24,-6,18],[-24,4,16],[46,4,14]]){x.beginPath();x.arc(cx+d[0]*c.s,c.y+d[1],d[2]*c.s,0,7);x.fill()}}
  for(let a=0;a<3;a++){const bx=mod(t*(.8+a*.2)+a*300,W+100)-50,by=60+a*25+Math.sin(t*.05+a)*6,w=Math.sin(t*.2+a)*5;
    x.strokeStyle='#223';x.lineWidth=1.5;x.beginPath();x.moveTo(bx-8,by-w);x.quadraticCurveTo(bx-3,by-4,bx,by);x.quadraticCurveTo(bx+3,by-4,bx+8,by-w);x.stroke()}
  const sea=x.createLinearGradient(0,185,0,235);sea.addColorStop(0,'hsl(200,60%,'+(48+k*10)+'%)');sea.addColorStop(1,'hsl(208,65%,'+(26+k*10)+'%)');
  x.fillStyle=sea;x.fillRect(0,185,W,50);
  x.fillStyle='rgba(255,240,200,.45)';for(let a=0;a<12;a++)x.fillRect(sunX-34+a*2+Math.sin(t*.05+a)*18-a*1.5,187+a*4,60-a*3.5,1.8);
  L(.12,140,(i,bx)=>{x.fillStyle='hsla(205,35%,'+(60+k*18)+'%,.85)';x.fillRect(bx,165+mod(i*37,22),110,80);x.beginPath();x.arc(bx+55,165+mod(i*37,22),18,Math.PI,0);x.fill()});
  L(.45,230,(i,bx)=>{
    const r=mod(i,7),top=110+r*9;
    const wg=x.createLinearGradient(bx,0,bx+200,0);wg.addColorStop(0,'#fffdf6');wg.addColorStop(1,'#e4dccb');x.fillStyle=wg;x.fillRect(bx,top,200,G-top);
    x.fillStyle='#cfc6b2';x.fillRect(bx+200,top+8,10,G-top-8);
    x.fillStyle='#f2ecdc';x.fillRect(bx-4,top-6,208,8);x.fillStyle='rgba(0,0,0,.12)';x.fillRect(bx-4,top+2,208,3);
    if(r%3===0){const dg=x.createRadialGradient(bx+90,top-20,4,bx+100,top-6,36);dg.addColorStop(0,'#5fa3e0');dg.addColorStop(1,'#1a4f8f');x.fillStyle=dg;x.beginPath();x.arc(bx+100,top-6,34,Math.PI,0);x.fill();x.fillStyle='#d9a93a';x.fillRect(bx+99,top-52,2,16);x.beginPath();x.arc(bx+100,top-54,3,0,7);x.fill()}
    const dg2=x.createLinearGradient(bx+28,0,bx+72,0);dg2.addColorStop(0,'#2a73c4');dg2.addColorStop(1,'#16508f');x.fillStyle=dg2;
    x.beginPath();x.moveTo(bx+28,G);x.lineTo(bx+28,G-62);x.arc(bx+50,G-62,22,Math.PI,0);x.lineTo(bx+72,G);x.fill();
    x.fillStyle='#e9c46a';for(let a=0;a<5;a++)for(let b=0;b<4;b++){x.beginPath();x.arc(bx+36+b*10,G-14-a*11,1.6,0,7);x.fill()}
    x.strokeStyle='#e7dfc9';x.lineWidth=4;x.beginPath();x.moveTo(bx+24,G);x.lineTo(bx+24,G-62);x.arc(bx+50,G-62,26,Math.PI,0);x.lineTo(bx+76,G);x.stroke();
    for(let w=0;w<2;w++){const wx=bx+106+w*38,wy=top+28;
      x.fillStyle=lit?'#ffcf5a':'#26344f';x.fillRect(wx,wy,22,36);
      x.strokeStyle='#8b5a2b';x.lineWidth=1;for(let a=1;a<4;a++){x.beginPath();x.moveTo(wx,wy+a*9);x.lineTo(wx+22,wy+a*9);x.stroke()}x.beginPath();x.moveTo(wx+11,wy);x.lineTo(wx+11,wy+36);x.stroke();

    }
  }
  for(const u of pu){const bob=Math.sin(t*.1)*4;
    if(u.k==='brik'){x.fillStyle='#e8b86d';x.beginPath();x.arc(u.x,u.y+bob,15,Math.PI,0);x.lineTo(u.x+15,u.y+bob+8);x.lineTo(u.x-15,u.y+bob+8);x.fill();x.fillStyle='#f4c542';x.fillRect(u.x-4,u.y+bob-6,8,6)}
    else{x.fillStyle='#c8102e';x.fillRect(u.x-11,u.y+bob-14,22,28);x.fillStyle='#fff';x.fillRect(u.x-11,u.y+bob-4,22,8);x.fillStyle='#c8102e';x.font='700 7px system-ui';x.textAlign='center';x.fillText('HARISSA',u.x,u.y+bob+3)}
    x.strokeStyle='rgba(255,255,255,.7)';x.lineWidth=2;x.beginPath();x.arc(u.x,u.y+bob,24,0,7);x.stroke()}
  // police
  const px=160-gap-30;
  if(st!=='menu'||true){
    person(px,G,false,'#1b2f5c','#12203d',cap);
    x.fillStyle=(t>>3)&1?'#e0203a':'#2a6bff';x.beginPath();x.arc(px+14,G-82,5,0,7);x.fill();
  }
  if(!(inv>0&&!turbo&&t%6<3))person(160,p.y,p.sl&&p.y>=G,'#ffffff','#1f5fa8',chechia);
  if(shield){x.strokeStyle='rgba(244,197,66,.9)';x.lineWidth=3;x.beginPath();x.arc(174,p.y-30,40,0,7);x.stroke()}
  if(turbo){x.fillStyle='rgba(224,32,58,.12)';x.fillRect(0,0,W,H)}
  for(const f of fx){if(f.s){x.globalAlpha=Math.min(1,f.l/30);x.fillStyle='#12315a';x.font='800 20px system-ui,sans-serif';x.textAlign='center';x.fillText(f.s,f.x,f.y);x.globalAlpha=1}else{x.fillStyle=f.c;x.fillRect(f.x,f.y,4,4)}}
  x.restore();
  if(st==='play'&&gap<80){x.globalAlpha=.35;x.fillStyle=(t>>3)&1?'#e0203a':'#2a6bff';x.fillRect(0,0,W,10);x.fillRect(0,H-10,W,10);x.globalAlpha=1}
  // HUD
  x.textAlign='left';x.font='700 20px system-ui,sans-serif';x.fillStyle='#12315a';
  x.fillText(Math.floor(dist/50)+' m',16,30);
  x.fillStyle='#f4c542';x.beginPath();x.arc(24,50,8,0,7);x.fill();
  x.fillStyle='#12315a';x.fillText(coins+' dinar',40,57);
  x.font='600 13px system-ui,sans-serif';x.fillText('Distance from the boulis',W-200,18);
  x.fillStyle='rgba(18,49,90,.25)';x.fillRect(W-200,24,170,12);
  x.fillStyle='hsl('+Math.max(0,gap)/230*120+',70%,45%)';x.fillRect(W-200,24,Math.max(0,gap)/230*170,12);
  x.fillStyle='#12315a';x.fillText('Best '+best+' m',W-200,56);
  if(turbo)x.fillText('TURBO '+Math.ceil(turbo/60)+'s',W-200,76);else if(shield)x.fillText('Brik shield ready',W-200,76);
  if(st!=='play'){
    x.fillStyle='rgba(10,25,50,.62)';x.fillRect(0,0,W,H);
    x.textAlign='center';x.fillStyle='#fff';
    if(st==='menu'){
      x.font='800 60px system-ui,sans-serif';x.fillText('HARBA!',W/2,130);
      x.font='600 20px system-ui,sans-serif';x.fillText('Run through the medina and don’t get caught by the boulis',W/2,170);
      x.font='500 16px system-ui,sans-serif';
      x.fillText('Jump (twice in the air!) over crates, Vespas and cats · slide under the washing line',W/2,215);
      x.fillText('Grab dinars, brik shields and harissa turbo to shake off the boulis',W/2,240);
      x.font='700 22px system-ui,sans-serif';x.fillStyle='#f4c542';x.fillText('Press Space or tap to start',W/2,300);
    }else{
      x.font='800 52px system-ui,sans-serif';x.fillText('CAUGHT!',W/2,140);
      x.font='600 22px system-ui,sans-serif';x.fillText(Math.floor(dist/50)+' m · '+coins+' dinar',W/2,185);
      x.font='500 16px system-ui,sans-serif';x.fillText('The boulis got you this time',W/2,215);
      x.font='700 22px system-ui,sans-serif';x.fillStyle='#f4c542';x.fillText('Space or tap to run again',W/2,285);
    }
  }
}
let last=performance.now(),acc=0;
function loop(n){acc+=Math.min(n-last,100);last=n;while(acc>=16.67){step();acc-=16.67}draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
