<!doctype html>
<html lang="en"><head>
    <meta name="robots" content="noindex,follow"/><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mind Gym</title>
<style>
:root{--bg:#eaf1f5;--fg:#10222e;--card:#fff;--mut:#5d7280;--ac:#0e8c8c;--ac2:#f0a020;--bad:#d64545;--ok:#1f9d55;--bd:#cfdce4;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1820;--fg:#e6f0f5;--card:#142a36;--mut:#8aa3b2;--ac:#2cc4c4;--ac2:#f5b43c;--bad:#ef6a6a;--ok:#41c27d;--bd:#24404f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1820;--fg:#e6f0f5;--card:#142a36;--mut:#8aa3b2;--ac:#2cc4c4;--ac2:#f5b43c;--bad:#ef6a6a;--ok:#41c27d;--bd:#24404f;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Avenir Next","Trebuchet MS",system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;padding:16px;min-height:100vh;box-sizing:border-box}
h1{font-size:34px;margin:8px 0 2px;letter-spacing:-.5px}
.sub{color:var(--mut);margin:0 0 16px}
.top{display:flex;justify-content:space-between;align-items:center}
.total{background:var(--fg);color:var(--bg);border-radius:18px;padding:16px;margin-bottom:12px;display:flex;gap:16px;align-items:center}
.total b{font-size:46px;display:block;line-height:1}.total small{font-size:12px}
.cats{flex:1;display:grid;gap:7px}
.cr{display:grid;grid-template-columns:96px 1fr;gap:8px;font-size:12px;align-items:center}
.cr i{height:6px;background:rgba(128,128,128,.4);border-radius:3px;display:block}
.cr u{display:block;height:100%;background:var(--ac2);border-radius:3px}
.g{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:10px;color:var(--fg);font:inherit;cursor:pointer}
.g:active{transform:scale(.98)}
.g .i{font-size:28px;width:44px;height:44px;display:grid;place-items:center;background:var(--bg);border-radius:12px}
.g b{display:block;font-size:17px}.g small{color:var(--mut)}
.g .b{margin-left:auto;text-align:right;font-size:12px;color:var(--mut)}.g .b strong{display:block;font-size:20px;color:var(--ac)}
button{font:inherit;color:var(--fg)}
.ghost{background:none;border:2px solid var(--bd);border-radius:12px;padding:6px 12px;cursor:pointer}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700;gap:8px}
.prog{height:6px;background:var(--bd);border-radius:3px;margin-bottom:18px}.prog i{display:block;height:100%;width:0;background:var(--ac);border-radius:3px;transition:width .3s}
.big{font-size:56px;font-weight:800;text-align:center;margin:30px 0;min-height:70px}.big.sm{font-size:32px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:22px 8px;font-size:24px;font-weight:700;cursor:pointer}
.opt:active{background:var(--ac);color:#fff}
.msg{text-align:center;color:var(--mut);height:28px;margin-bottom:12px;font-weight:600}
.grid3{display:grid;gap:10px;grid-template-columns:repeat(3,1fr)}.gn{display:grid;gap:6px}
.cell{aspect-ratio:1;border-radius:14px;border:2px solid var(--bd);background:var(--card);cursor:pointer;transition:background .1s}
.cell.on{background:var(--ac);border-color:var(--ac)}.cell.bad{background:var(--bad);border-color:var(--bad)}
.gn .cell{border:0;border-radius:10px}
.res{text-align:center;margin-top:40px}.res .big{margin:10px 0}.res p{color:var(--mut)}
.nb{color:var(--ac2);font-weight:800;font-size:20px}
.pri{display:block;width:100%;margin-top:12px;background:var(--ac);color:#fff;border:0;border-radius:14px;padding:16px;font-size:18px;font-weight:700;cursor:pointer}
.sec{background:none;border:2px solid var(--bd);color:var(--fg)}
button:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),app=$('#app'),rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[rnd(0,a.length-1)];
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
let T=[],queue=[],mem0={};
const L={en:{sub:'Adaptive brain training: the game gets harder as you improve',bfi:'Brain Fitness Index',work:'Start daily workout',score:'Score',again:'Play again',next:'Next game',menu:'Menu',nb:'New best!',best:'Best',watch:'Watch…',go:'Your turn',odd:'Tap the odd one out',
mem:'Pattern Memory',memd:'Repeat the growing sequence',stroop:'Color Clash',stroopd:'Tap the ink color, not the word',odd2:'Odd One Out',oddd:'Spot the slightly different shade',seq:'Number Series',seqd:'Find the next number',math:'Quick Math',mathd:'Mental arithmetic under pressure',
cats:{memory:'Memory',attention:'Attention',perception:'Perception',logic:'Logic',speed:'Thinking speed'},colors:['Red','Blue','Green','Yellow','Purple','Orange']}};
const D=()=>L.en,C=['#e03b3b','#2f6fe0','#22a05a','#e0b020','#8e44c8','#ee7d1f'];
const ld=()=>{try{return JSON.parse(localStorage.getItem('mg_best')||'{}')}catch(e){return{}}};
const best=()=>Object.assign({},mem0,ld());
const stop=()=>{T.forEach(t=>{clearTimeout(t);clearInterval(t)});T=[]};
const show=h=>{app.innerHTML=h};
const near=a=>{const s=new Set([a]),r=Math.max(5,Math.round(Math.abs(a)*.2));while(s.size<4){const x=a+rnd(-r,r);if(x>=0)s.add(x)}return shuf([...s])};
function choose(el,q,opts,ans,done,sm){el.innerHTML=`<div class="big${sm?' sm':''}">${q}</div><div class="opts">${opts.map(v=>`<button class="opt" data-v="${v}">${v}</button>`).join('')}</div>`;
 el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>done(+b.dataset.v===ans))}
function series(l){const t=rnd(0,Math.min(l,5)),a=rnd(1,9),s=[];
 if(t===0){const d=rnd(2,9);for(let i=0;i<6;i++)s.push(a+d*i)}
 else if(t===1){const r=rnd(2,3);for(let i=0;i<6;i++)s.push((a%4+1)*r**i)}
 else if(t===2){let x=a,d=rnd(1,3);for(let i=0;i<6;i++){s.push(x);x+=d;d++}}
 else if(t===3){const p=rnd(4,9),q=rnd(1,3);let x=a+5;for(let i=0;i<6;i++){s.push(x);x+=i%2?-q:p}}
 else if(t===4){s.push(rnd(1,3),rnd(2,5));while(s.length<6)s.push(s[s.length-1]+s[s.length-2])}
 else{const c=rnd(0,5);for(let i=0;i<6;i++)s.push((i+1)**2+c)}
 return s}
const GM={
 mem:{c:'memory',i:'🧩',n:8,round(el,l,done){const d=D(),len=Math.min(2+l,9),seq=[...Array(len)].map(()=>rnd(0,8));let pos=0,lock=true;
  el.innerHTML=`<div class="msg" id="m">${d.watch}</div><div class="grid3">${[...Array(9)].map((_,i)=>`<button class="cell" data-i="${i}"></button>`).join('')}</div>`;
  const cs=[...el.querySelectorAll('.cell')],lit=(i,ms)=>{cs[i].classList.add('on');T.push(setTimeout(()=>cs[i].classList.remove('on'),ms))};
  seq.forEach((c,k)=>T.push(setTimeout(()=>lit(c,450),600+k*700)));
  T.push(setTimeout(()=>{lock=false;$('#m').textContent=d.go},600+len*700));
  cs.forEach(c=>c.onclick=()=>{if(lock)return;const i=+c.dataset.i;
   if(i!==seq[pos]){lock=true;c.classList.add('bad');done(false);return}
   lit(i,200);pos++;if(pos===len){lock=true;done(true)}})}},
 stroop:{c:'attention',i:'🎨',n:15,round(el,l,done){const d=D(),k=Math.min(3+(l>>1),6),wi=rnd(0,k-1),ink=Math.random()<.8?(wi+rnd(1,k-1))%k:wi;
  el.innerHTML=`<div class="big" style="color:${C[ink]}">${d.colors[wi]}</div><div class="opts">${d.colors.slice(0,k).map((n,i)=>`<button class="opt" data-i="${i}">${n}</button>`).join('')}</div>`;
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>done(+b.dataset.i===ink))}},
 odd:{c:'perception',i:'👁️',n:12,round(el,l,done){const n=Math.min(2+Math.ceil(l/2),6),h=rnd(0,360),df=Math.max(4,26-l*3),o=rnd(0,n*n-1),sg=Math.random()<.5?1:-1;
  el.innerHTML=`<div class="msg">${D().odd}</div><div class="gn" style="grid-template-columns:repeat(${n},1fr)">${[...Array(n*n)].map((_,i)=>`<button class="cell" data-i="${i}" style="background:hsl(${h} 65% ${i===o?50+sg*df:50}%)"></button>`).join('')}</div>`;
  el.querySelectorAll('.cell').forEach(b=>b.onclick=()=>done(+b.dataset.i===o))}},
 seq:{c:'logic',i:'🔢',n:10,round(el,l,done){const s=series(l);choose(el,s.slice(0,5).join(', ')+', ?',near(s[5]),s[5],done,1)}},
 math:{c:'speed',i:'➕',n:15,round(el,l,done){const op=pick(l<2?['+','-']:['+','-','×']);let a,b,r;
  if(op==='×'){a=rnd(2,6+l);b=rnd(2,9);r=a*b}else if(op==='+'){a=rnd(5,10*l+15);b=rnd(5,10*l+15);r=a+b}else{a=rnd(10,15*l+15);b=rnd(2,a-1);r=a-b}
  choose(el,a+' '+op+' '+b,near(r),r,done)}}};
const name=k=>D()[k==='odd'?'odd2':k];
function menu(){stop();queue=[];const b=best(),d=D(),ks=Object.keys(GM),bfi=Math.round(ks.reduce((a,k)=>a+(b[k]||0),0)/ks.length);
 show(`<div class="top"><h1>Mind Gym</h1></div><p class="sub">${d.sub}</p>
 <div class="total"><div><small>${d.bfi}</small><b>${bfi}</b></div><div class="cats">${ks.map(k=>`<div class="cr"><span>${d.cats[GM[k].c]}</span><i><u style="width:${Math.min(100,(b[k]||0)/3)}%"></u></i></div>`).join('')}</div></div>
 <button class="pri" id="wk" style="margin:0 0 12px">${d.work}</button>`+
 ks.map(k=>`<button class="g" data-k="${k}"><span class="i">${GM[k].i}</span><span><b>${name(k)}</b><small>${d[k==='odd'?'oddd':k+'d']}</small></span><span class="b">${d.best}<strong>${b[k]||0}</strong></span></button>`).join(''));
 $('#wk').onclick=()=>{queue=Object.keys(GM);run(queue.shift())};
 document.querySelectorAll('.g').forEach(e=>e.onclick=()=>run(e.dataset.k));}
function run(k){stop();const g=GM[k],d=D(),b=best();let lvl=Math.min(1+Math.floor((b[k]||0)/(g.n*20)),5),streak=0,r=0,score=0,maxl=lvl;
 show(`<div class="bar"><button class="ghost" id="bk">←</button><span id="s"></span><span id="f"></span></div><div class="prog"><i id="pb"></i></div><div id="st"></div>`);
 $('#bk').onclick=menu;
 const upd=()=>{$('#s').textContent=name(k)+' · Lv '+lvl+' · '+score;$('#pb').style.width=(r/g.n*100)+'%'};
 function next(){if(r>=g.n){$('#pb').style.width='100%';return end(k,score,'Level '+maxl)}r++;upd();let fin=false;$('#f').textContent='';
  g.round($('#st'),lvl,ok=>{if(fin)return;fin=true;
   $('#f').textContent=ok?'✓':'✗';$('#f').style.color=ok?'var(--ok)':'var(--bad)';
   if(ok){score+=10+lvl*5;if(++streak>=2){lvl++;streak=0;maxl=Math.max(maxl,lvl)}}else{streak=0;lvl=Math.max(1,lvl-1)}
   upd();T.push(setTimeout(next,450))})}
 next();}
function end(k,score,extra){stop();const b=best(),nb=score>(b[k]||0),d=D();if(nb){b[k]=score;mem0=b;try{localStorage.setItem('mg_best',JSON.stringify(b))}catch(e){}}
 show(`<div class="res"><p>${name(k)}</p><div class="big">${score}</div><p>${extra}</p>${nb&&score>0?`<div class="nb">${d.nb}</div>`:`<p>${d.best}: ${b[k]||0}</p>`}
 ${queue.length?`<button class="pri" id="nx">${d.next}</button>`:`<button class="pri" id="ag">${d.again}</button>`}<button class="pri sec" id="mn">${d.menu}</button></div>`);
 if(queue.length)$('#nx').onclick=()=>run(queue.shift());else $('#ag').onclick=()=>run(k);
 $('#mn').onclick=menu;}
menu();
</script></body></html>
